{{ define "header" }}
<!doctype html>
<html lang="en">
    <head>
        <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1" />
        <base target="_blank">

        <style>
            body {
                background-color: #F0F1F3;
                font-family: 'book antiqua', palatino, serif;
                font-size: 18px;
                line-height: 1.5;
                margin: 0;
                color: #444444;
            }

            .wrap {
                background-color: #fff;
                padding: 30px;
                max-width: 525px;
                margin: 0 auto;
                border-radius: 5px;
            }

            .header {
                border-bottom: 1px solid #eee;
                padding-bottom: 15px;
                margin-bottom: 15px;
                text-align: center;
            }

            .footer {
                text-align: center;
                color: #666666;
            }
                .footer a {
                    color: #666666;
                }

            .gutter {
                padding: 30px;
            }
            .button {
                background: #0055d4;
                color: #fff !important;
                display: inline-block;
                border-radius: 3px;
                padding: 10px 30px;
                text-align: center;
                text-decoration: none;
                font-weight: bold;
            }
            .button:hover {
                background: #222222;
                color: #fff;
            }
            img {
                max-width: 100%;
            }

            a {
                color: #0055d4;
            }
                a:hover {
                    color: #111111;
                }
            @media screen and (max-width: 600px) {
                .wrap {
                    max-width: auto;
                }
                .gutter {
                    padding: 10px;
                }
            }
        </style>
    </head>
<body style="background-color: #F0F1F3;">
    <div class="gutter">&nbsp;</div>
    <div class="wrap">
        <div class="header">
            {{ if ne LogoURL "" }}
                <a target="_blank" rel="noopener noreferrer" href="https://directactionvillage.org/"><img src="{{ LogoURL }}" alt="The Direct Action Village logo, an illustration of a covered stone well." /></a>
            {{ end }}
        </div>
{{ end }}

{{ define "footer" }}
    </div>

    <div class="footer">
        <p>{{ L.T "public.poweredBy" }} <a href="https://listmonk.app" target="_blank" rel="noopener noreferrer">listmonk</a></p>
    </div>
    <div class="gutter">&nbsp;</div>
</body>
</html>
{{ end }}
